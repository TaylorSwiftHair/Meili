<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Meili simulated camera QA</title></head><body><div style="padding:16px;background:#fff;position:sticky;top:0;z-index:100"><b>SIMULATED CAMERA · INTERNAL QA ONLY</b> <button id="test-front">Front test frame</button><button id="test-side">Side test frame</button><button id="test-texture">Texture test frame</button><button id="test-dark">Dark test frame</button><button id="test-leave">Leave capture</button><output id="test-metrics"></output></div><main id="app"></main><script type="module">
import {captureFlow,stopCapture} from '/capture.js';
const app=document.querySelector('#app'),c=document.createElement('canvas');c.width=1024;c.height=771;const ctx=c.getContext('2d');const images={};for(const key of ['front','side','texture']){const im=new Image();im.src='/qa-camera/'+key+'.jpg';await im.decode();images[key]=im;document.querySelector('#test-'+key).onclick=()=>ctx.drawImage(im,0,0,c.width,c.height)}ctx.drawImage(images.front,0,0,c.width,c.height);document.querySelector('#test-dark').onclick=()=>{ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height)};const streams=[];let requests=0;const metrics=()=>document.querySelector('#test-metrics').textContent=`Requests: ${requests}; live tracks: ${streams.flatMap(s=>s.getTracks()).filter(t=>t.readyState==='live').length}`;
const mediaDevices={getUserMedia:async()=>{requests++;const s=c.captureStream(10);streams.push(s);metrics();return s}};setInterval(metrics,300);document.querySelector('#test-leave').onclick=()=>{stopCapture();app.innerHTML='<h2>Capture closed</h2>';metrics()};captureFlow({app,head:(k,t,d)=>`<div class="page-head"><span class="eyebrow">${k}</span><h1>${t}</h1><p>${d}</p></div>`,toast:()=>{},mediaDevices,onSkip:()=>{stopCapture();app.innerHTML='<h2>Quiz-only started</h2>'},onComplete:r=>{stopCapture();app.innerHTML=`<h2>Quiz started after ${r.viewCount} usable pattern views</h2>`;metrics()}});
</script></body></html>
